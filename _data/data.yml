experiences:
  title: Experiences
  info:
  - role: Digital Teaching Assistant
    time: March 2025 - Now
    company: Code Camp, St. Wilfrid's School Burgess Hill
    details: |
      Managed STEM workshops for children, troubleshooting hardware/software issues. Primary duty as technical assistant and also worked as class lead on occasions. DBS qualified and safeguarding trained.
  - role: Volunteer
    time: April 2024 – 2025
    company: Haywards Heath British Heart Foundation
    details: |
      As part of my volunteering work for British Heart Foundation I was responsible for sorting, categorising and pricing donated media (Blu-ray, DVDs and CDs). 
  - role: Volunteer / Technical Support
    time: 2018 - 2021
    company: Coder Dojo
    details: |
      As a registered STEM Ambassador and Code Club/Coder Dojo volunteer, I assisted with setting up equipment labs, providing technical support, and helping young students in a classroom environment.  This also involved general troubleshooting and user support. 

