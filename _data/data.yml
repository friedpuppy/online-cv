career-profile:
  title: Career Profile
  summary: |
    Hi, I'm Callum. I'm a recent Computer Games Design graduate based in the UK, passionate about creating immersive and innovative gaming experiences. I specialise in game development using Unity & Unreal Engine with a 
    strong foundation in C#, 3D modelling and level design. I also enjoy sharing my work through worklogs and devlogs on youtube. I'm currently looking for opportunities in game design, game development, or technical support.
    Available full time.
    
    
