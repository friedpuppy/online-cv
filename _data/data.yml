projects:
  title: Projects
  intro: >
    These are projects that I've worked on that I am incredibly proud of, showcasing my skills in 2D & 3D
  assignments:
  - title: A Pier to the past
    link: "https://friedpuppy.itch.io/a-pier-to-the-past"
    tagline: "A Pier to the Past is an exploration game about Brighton, written in Python with simple controls. It features bitesize chunks of Brighton history, presented as three stories. The player will learn lesser-known historic facts that even long-term residents have little knowledge of. Project constituted my final thesis for my BSc which I achieved an A grade."

